stages:
  - test
  - deploy

include:
# ============================================================
# node-exporter — identical stateless stack, matrix over all hosts
# ============================================================
  - component: $CI_SERVER_FQDN/components/docker/validate-compose@~latest
    inputs:
      as: "lint-node-exporter"
      local_path: "deployments/node-exporter"
  - component: $CI_SERVER_FQDN/components/docker/deploy-compose-matrix@~latest
    inputs:
      as: "deploy-node-exporter"
      environments: [ cloudy, dev-1, dev-2, dev-3, portainer, prod-1, valhalla ]
      local_path: "deployments/node-exporter"
      remote_path: "deployments/node-exporter-$TARGET_ENV-vm-1"

# ============================================================
# cadvisor — identical stateless stack, matrix over all hosts
# ============================================================
  - component: $CI_SERVER_FQDN/components/docker/validate-compose@~latest
    inputs:
      as: "lint-cadvisor"
      local_path: "deployments/cadvisor"
  - component: $CI_SERVER_FQDN/components/docker/deploy-compose-matrix@~latest
    inputs:
      as: "deploy-cadvisor"
      environments: [ cloudy, dev-1, dev-2, dev-3, portainer, prod-1, valhalla ]
      local_path: "deployments/cadvisor"
      remote_path: "deployments/cadvisor-$TARGET_ENV-vm-1"
      substitute_vars: '$CADVISOR_DOCKER_LIB'   # optional per-host docker-root override (default /var/lib/docker)

# ============================================================
# prometheus — the servers that store metrics; both are Grafana datasources.
# One deploy-compose job per server (not a matrix): each keeps its TSDB in a
# named volume, and the fixed remote_path keeps that volume across redeploys.
# Each job runs only when its own deployments/ folder changes.
# ============================================================
# dev-1: central scraper. Pulls node-exporter (:9100) and cadvisor (:8081)
# from every host listed in config/prometheus.yaml. Backs the Hosts and
# Containers overview dashboards. Adding a host to the matrices above also
# needs its two scrape jobs there.
  - component: $CI_SERVER_FQDN/components/docker/validate-compose@~latest
    inputs:
      as: "lint-prometheus-dev-1"
      local_path: "deployments/prometheus-dev-1-vm-1"
  - component: $CI_SERVER_FQDN/components/docker/deploy-compose@~latest
    inputs:
      as: "deploy-prometheus-dev-1"
      environment: "dev-1"                                # host derives to dev-1-vm.margusm.dev
      local_path: "deployments/prometheus-dev-1-vm-1"
      remote_path: "deployments/prometheus-dev-1-vm-1"

# dev-2: remote-write receiver (192.168.40.112:9090/api/v1/write). Scrapes
# nothing but itself; app metrics are pushed to it by the OpenTelemetry
# collector (homelab/opentelemetry) and Tempo's metrics generator (homelab/tempo).
  - component: $CI_SERVER_FQDN/components/docker/validate-compose@~latest
    inputs:
      as: "lint-prometheus-dev-2"
      local_path: "deployments/prometheus-dev-2-vm-1"
  - component: $CI_SERVER_FQDN/components/docker/deploy-compose@~latest
    inputs:
      as: "deploy-prometheus-dev-2"
      environment: "dev-2"                                # host derives to dev-2-vm.margusm.dev
      local_path: "deployments/prometheus-dev-2-vm-1"
      remote_path: "deployments/prometheus-dev-2-vm-1"
