---
services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    # Defaults (1s housekeeping, per-container du scans, every Docker label as a
    # metric label) cost 10-15% of a core and hundreds of MB per host.
    # - housekeeping every 15s = the Prometheus scrape interval
    # - docker_only: Docker containers + host-level (id="/") stats only
    # - no Docker labels on series (name and image labels are kept)
    # - "disk" (container_fs_usage_bytes) is the du scan; diskIO stays enabled
    command:
      - --housekeeping_interval=15s
      - --docker_only=true
      - --store_container_labels=false
      - --disable_metrics=advtcp,cpu_topology,cpuset,disk,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    mem_limit: 512m
    logging:
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - 8081:8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      # source overridable per host (CADVISOR_DOCKER_LIB) for a non-default docker root
      - ${CADVISOR_DOCKER_LIB:-/var/lib/docker}:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    restart: unless-stopped
    networks:
      - monitoring

networks:
  monitoring:
    name: monitoring
    driver: bridge
    attachable: true